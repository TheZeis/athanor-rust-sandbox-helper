[build-dependencies.version_check]
version = "0.9"

[dependencies.serde]
default-features = false
features = ["derive", "alloc"]
optional = true
version = "1.0"

[dev-dependencies.fxhash]
version = "0.2.1"

[dev-dependencies.quickcheck]
version = "1.0"

[dev-dependencies.serde]
version = "1.0"

[dev-dependencies.serde_derive]
version = "1.0"

[dev-dependencies.serde_json]
version = "1.0"

[features]
default = ["std"]
std = []
unstable = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Orson Peters <orsonpeters@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["data-structures", "memory-management", "caching"]
description = "Slotmap data structure"
edition = "2018"
keywords = ["slotmap", "storage", "allocator", "arena", "reference"]
license = "Zlib"
name = "slotmap"
readme = "README.md"
repository = "https://github.com/orlp/slotmap"
rust-version = "1.58.0"
version = "1.1.1"
