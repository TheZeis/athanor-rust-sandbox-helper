[dependencies.image]
optional = true
version = "0.21.0"

[dependencies.resize]
optional = true
version = "0.3.0"

[features]
bundled = ["sdl", "sdl2/bundled", "sdl2/static-link"]
default = ["std", "sdl", "unifont"]
image = ["std", "dep:image", "dep:resize"]
sdl = ["dep:sdl2"]
std = []
unifont = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "The Orbital Client Library"
documentation = "https://docs.rs/orbclient"
edition = "2018"
keywords = ["orbital", "redox", "ui"]
license = "MIT"
name = "orbclient"
readme = "README.md"
repository = "https://gitlab.redox-os.org/redox-os/orbclient"
version = "0.3.55"

[target.'cfg(not(target_os = "redox"))'.dependencies.raw-window-handle]
optional = true
version = "0.5.2"

[target.'cfg(not(target_os = "redox"))'.dependencies.sdl2]
optional = true
version = "0.38.0"

[target.'cfg(target_os = "redox")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "redox")'.dependencies.libredox]
version = "0.1"
