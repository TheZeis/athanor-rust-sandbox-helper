[dependencies.proc-macro-crate]
optional = true
version = ">= 1, <= 3"

[dependencies.proc-macro2]
version = "1.0.60"

[dependencies.quote]
version = "1"

[dependencies.syn]
features = ["derive", "extra-traits", "parsing"]
version = "2"

[dev-dependencies.syn]
features = ["extra-traits", "parsing"]
version = "2"

[features]
complex-expressions = ["syn/full"]
default = ["std"]
external_doc = []
std = ["proc-macro-crate"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Daniel Wagner-Hall <dawagner@gmail.com>", "Daniel Henry-Mantilla <daniel.henry.mantilla@gmail.com>", "Vincent Esche <regexident@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = []
description = "Internal implementation details for ::num_enum (Procedural macros to make inter-operation between primitives and enums easier)"
edition = "2021"
keywords = []
license = "BSD-3-Clause OR MIT OR Apache-2.0"
name = "num_enum_derive"
readme = "README.md"
repository = "https://github.com/illicitonion/num_enum"
rust-version = "1.70.0"
version = "0.7.6"

[package.metadata.docs.rs]
features = ["external_doc"]
