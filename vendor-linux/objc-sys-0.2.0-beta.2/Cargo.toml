[build-dependencies.cc]
optional = true
version = "1"

[features]
alloc = []
apple = []
default = ["std", "apple"]
gnustep-1-7 = []
gnustep-1-8 = ["gnustep-1-7"]
gnustep-1-9 = ["gnustep-1-8"]
gnustep-2-0 = ["gnustep-1-9"]
gnustep-2-1 = ["gnustep-2-0"]
std = ["alloc"]
unstable-c-unwind = []
unstable-docsrs = []
unstable-exception = ["cc"]
unstable-objfw = []
unstable-winobjc = ["gnustep-1-8"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Mads Marquart <mads@marquart.dk>"]
categories = ["external-ffi-bindings", "os::macos-apis"]
description = "Raw bindings to the Objective-C runtime and ABI"
documentation = "https://docs.rs/objc-sys/"
edition = "2021"
keywords = ["objective-c", "macos", "ios", "objc_msgSend", "sys"]
license = "MIT"
name = "objc-sys"
readme = "README.md"
repository = "https://github.com/madsmtm/objc2"
resolver = "2"
version = "0.2.0-beta.2"

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"
features = ["std", "unstable-docsrs"]
no-default-features = true
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin", "aarch64-apple-ios", "x86_64-apple-ios", "x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
